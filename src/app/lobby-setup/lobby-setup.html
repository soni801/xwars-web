<!-- Current players -->
<div>
  <p>Status: {{ socketStatus }}</p>
  <div>
    <p>Players:</p>
    @for (player of socketPlayers; track player) {
      <p style="color: {{ player.color }}">{{ player.name }}</p>
    }
  </div>
</div>

<!-- Player options -->
<input type="text" placeholder="Lobby code" [(ngModel)]="lobbyCode">
<input type="text" placeholder="Name" [(ngModel)]="playerName">
<input type="text" placeholder="Color" [(ngModel)]="playerColor">

<!-- Lobby controls -->
<a class="button" (click)="createLobby()">Create lobby</a>
<a class="button" (click)="joinLobby()">Join lobby</a>

<!-- Menu -->
<a class="button">Start</a>
<a class="button" routerLink="/home">Back</a>
